    <meta charset="UTF-8" />
    <script>
      // After a deploy, a tab holding the old page can ask for code files that no longer exist.
      // If a script or stylesheet fails to load, reload once to pick up the new version.
      window.addEventListener("error", function (e) {
        var t = e.target;
        if (!t || (t.tagName !== "SCRIPT" && t.tagName !== "LINK")) return;
        try {
          if (sessionStorage.getItem("haleo:reloaded")) return;
          sessionStorage.setItem("haleo:reloaded", "1");
        } catch (_) { return; }
        location.reload();
      }, true);
    </script>
