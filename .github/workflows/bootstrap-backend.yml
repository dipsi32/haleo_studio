# Sets up a brand-new Supabase project end to end, from nothing:
#   1. the database (every migration, in order)
#   2. edge function secrets (from GitHub secrets)
#   3. edge functions
#   4. sign-in settings (site address, redirect addresses, Google)
#   5. a smoke test that proves it works
# Safe to run again: each step is idempotent. Run it from the Actions tab.
# Setup and the list of secrets: docs/new-backend.md
name: Bootstrap backend

# Run by hand from the Actions tab, and by Deploy (dev) and Promote (demo,
# production) so a backend always ships with the site that needs it.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which backend to set up
        type: choice
        options: [dev, demo, production]
        default: dev
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        description: Commit to deploy (defaults to the one that triggered the run)
        type: string
        required: false
        default: ""

concurrency:
  group: bootstrap-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.environment }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ inputs.environment == 'production' && secrets.PRODUCTION_DB_PASSWORD || inputs.environment == 'demo' && secrets.DEMO_DB_PASSWORD || secrets.DEV_DB_PASSWORD }}
      # Third-party keys shared by both backends. Any that are empty are skipped.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      YELP_API_KEY: ${{ secrets.YELP_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ vars.RESEND_FROM }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Load settings
        run: |
          [ -f "deploy/$TARGET.env" ] || { echo "::error::No deploy/$TARGET.env"; exit 1; }
          grep -E '^[A-Z_]+=' "deploy/$TARGET.env" >> "$GITHUB_ENV"

      - name: Check what we need
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF SUPABASE_URL SUPABASE_PUBLISHABLE_KEY APP_URL; do
            if [ -z "${!v}" ]; then echo "::error::Missing $v for $TARGET. Secrets go in GitHub; the rest in deploy/$TARGET.env. See docs/new-backend.md."; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          # Each environment has its own database. Never two on one project.
          for f in deploy/*.env; do
            [ "$f" = "deploy/$TARGET.env" ] && continue
            other=$(grep -E '^PROJECT_REF=' "$f" | cut -d= -f2-)
            if [ -n "$other" ] && [ "$other" = "$PROJECT_REF" ]; then
              echo "::error::$TARGET and $(basename "$f" .env) point at the same Supabase project. Refusing."; exit 1
            fi
          done
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY is not set, so the AI features will not work yet."; fi

      # Pinned: "latest" became v3.0.0 on Nov 3, 2026, and v3 points
      # `db push` at a local database unless told otherwise, so every deploy
      # failed before reaching production. Move this deliberately, after
      # checking the release notes.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.1

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Database (migrations)
        run: |
          supabase db push --dry-run
          supabase db push

      - name: Function secrets
        run: |
          : > /tmp/secrets.env
          for v in ANTHROPIC_API_KEY GEMINI_API_KEY OPENAI_API_KEY GOOGLE_PLACES_API_KEY YELP_API_KEY FIRECRAWL_API_KEY VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT RESEND_API_KEY RESEND_FROM; do
            val="${!v}"
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            printf '%s=%s\n' "$v" "$val" >> /tmp/secrets.env
          done
          printf 'PUBLIC_APP_URL=%s\n' "$APP_URL" >> /tmp/secrets.env
          supabase secrets set --env-file /tmp/secrets.env --project-ref "$PROJECT_REF"
          rm -f /tmp/secrets.env

      # Production and demo skip the seed-test-* functions: they create test data and are public.
      # One function failing (Supabase sometimes answers a deploy with a 500,
      # especially right after a paused project wakes up) must not stop the
      # rest, or sign-in settings and the smoke test. Retry once, keep going,
      # and fail the run at the end naming what didn't deploy.
      - name: Edge functions
        run: |
          failed=""
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            if [ "$TARGET" != "dev" ] && [[ "$fn" == seed-test-* ]]; then echo "skipping $fn on $TARGET"; continue; fi
            echo "deploying $fn"
            if ! supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api; then
              echo "::warning::$fn failed to deploy, retrying in 15s"
              sleep 15
              if ! supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api; then
                # mcp (the AI-assistant connector) isn't used by the app. Warn, don't fail the run.
                if [ "$fn" = "mcp" ]; then echo "::warning::mcp did not deploy. The app doesn't use it; the previous version stays live."; else failed="$failed $fn"; fi
              fi
            fi
          done
          echo "FAILED_FUNCTIONS=${failed# }" >> "$GITHUB_ENV"
          [ -n "$failed" ] && echo "::error::These functions did not deploy:$failed. Everything else did. Re-run this workflow to retry." || true

      # Guest sessions (external_anonymous_users_enabled) let homeowners send a
      # brief through a contractor link with no sign-up wall. Custom sign-in
      # email templates need a paid plan or our own SMTP, so they are not set
      # here: the claim screen uses the default email and its sign-in link.
      - name: Sign-in settings
        run: |
          app="${APP_URL%/}"
          # The main address, plus any others that still serve the site (www, the old pages.dev links).
          allow="$app,$app/**"
          for u in $(echo "${APP_ALSO_URLS:-}" | tr ',' ' '); do u="${u%/}"; allow="$allow,$u,$u/**"; done
          [ -n "$RESEND_API_KEY" ] && echo "::add-mask::$RESEND_API_KEY"
          # Sign-in emails go out through Resend when its key is set: Supabase's own
          # mailer only sends a few an hour, which real users would hit.
          from_addr=$(echo "${RESEND_FROM:-}" | sed -E 's/.*<([^>]+)>.*/\1/')
          from_name=$(echo "${RESEND_FROM:-}" | sed -nE 's/^ *"?([^"<]+)"? *<.*/\1/p' | sed 's/ *$//')
          body=$(jq -n --arg site "$app" --arg allow "$allow" \
            --arg gid "$GOOGLE_OAUTH_CLIENT_ID" --arg gsec "$GOOGLE_OAUTH_CLIENT_SECRET" \
            --arg rkey "$RESEND_API_KEY" --arg rfrom "$from_addr" --arg rname "${from_name:-Haleo}" '
            {site_url: $site, uri_allow_list: $allow, external_email_enabled: true, external_anonymous_users_enabled: true}
            + (if $gid != "" and $gsec != "" then {external_google_enabled: true, external_google_client_id: $gid, external_google_secret: $gsec} else {} end)
            + (if $rkey != "" and $rfrom != "" then {smtp_host: "smtp.resend.com", smtp_port: "465", smtp_user: "resend", smtp_pass: $rkey, smtp_admin_email: $rfrom, smtp_sender_name: $rname, rate_limit_email_sent: 60} else {} end)')
          echo "::add-mask::$GOOGLE_OAUTH_CLIENT_SECRET"
          code=$(curl -sS -o /tmp/auth.out -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          if [ "$code" -ge 300 ]; then echo "::error::Sign-in settings failed ($code)"; cat /tmp/auth.out; exit 1; fi
          if [ -z "$GOOGLE_OAUTH_CLIENT_ID" ]; then echo "::warning::Google sign-in not configured (GOOGLE_OAUTH_CLIENT_ID/SECRET missing). Email sign-in works."; fi
          if [ -z "$RESEND_API_KEY" ] || [ -z "$RESEND_FROM" ]; then echo "::warning::Sign-in emails use Supabase's built-in mailer (a few an hour). Set RESEND_API_KEY and the RESEND_FROM variable to send through Resend."; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Smoke test
        run: node scripts/smoke.mjs "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY"

      - name: Functions that didn't deploy
        if: env.FAILED_FUNCTIONS != ''
        run: |
          echo "::error::Not deployed: $FAILED_FUNCTIONS. Everything else is live. Re-run this workflow to retry them."
          exit 1
