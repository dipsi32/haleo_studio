# Sets up a brand-new Supabase project end to end, from nothing:
#   1. the database (every migration, in order)
#   2. edge function secrets (from GitHub secrets)
#   3. edge functions
#   4. sign-in settings (site address, redirect addresses, Google)
#   5. a smoke test that proves it works
# Safe to run again: each step is idempotent. Run it from the Actions tab.
# Setup and the list of secrets: docs/new-backend.md
name: Bootstrap backend

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Which backend to set up
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: bootstrap-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.environment }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ inputs.environment == 'production' && secrets.PRODUCTION_PROJECT_ID || secrets.STAGING_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ inputs.environment == 'production' && secrets.PRODUCTION_DB_PASSWORD || secrets.STAGING_DB_PASSWORD }}
      SUPABASE_URL: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SUPABASE_URL || secrets.STAGING_SUPABASE_URL }}
      PUBLISHABLE_KEY: ${{ inputs.environment == 'production' && secrets.PRODUCTION_SUPABASE_PUBLISHABLE_KEY || secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      APP_URL: ${{ inputs.environment == 'production' && vars.PRODUCTION_APP_URL || vars.STAGING_APP_URL }}
      OTHER_PROJECT_REF: ${{ inputs.environment == 'production' && secrets.STAGING_PROJECT_ID || secrets.PRODUCTION_PROJECT_ID }}
      # Third-party keys shared by both backends. Any that are empty are skipped.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      YELP_API_KEY: ${{ secrets.YELP_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Check what we need
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN PROJECT_REF SUPABASE_DB_PASSWORD SUPABASE_URL PUBLISHABLE_KEY APP_URL; do
            if [ -z "${!v}" ]; then echo "::error::Missing $v for $TARGET. See docs/new-backend.md for where to set it."; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          if [ "$PROJECT_REF" = "$OTHER_PROJECT_REF" ]; then
            echo "::error::Staging and production point at the same Supabase project. Refusing."; exit 1
          fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::warning::ANTHROPIC_API_KEY is not set, so the AI features will not work yet."; fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Database (migrations)
        run: |
          supabase db push --dry-run
          supabase db push

      - name: Function secrets
        run: |
          : > /tmp/secrets.env
          for v in ANTHROPIC_API_KEY GEMINI_API_KEY OPENAI_API_KEY GOOGLE_PLACES_API_KEY YELP_API_KEY FIRECRAWL_API_KEY VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT; do
            val="${!v}"
            [ -n "$val" ] || continue
            echo "::add-mask::$val"
            printf '%s=%s\n' "$v" "$val" >> /tmp/secrets.env
          done
          printf 'PUBLIC_APP_URL=%s\n' "$APP_URL" >> /tmp/secrets.env
          supabase secrets set --env-file /tmp/secrets.env --project-ref "$PROJECT_REF"
          rm -f /tmp/secrets.env

      # Production skips the seed-test-* functions: they create test data and are public.
      - name: Edge functions
        run: |
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            if [ "$TARGET" = "production" ] && [[ "$fn" == seed-test-* ]]; then echo "skipping $fn on production"; continue; fi
            echo "deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
          done

      - name: Sign-in settings
        run: |
          app="${APP_URL%/}"
          body=$(jq -n --arg site "$app" --arg allow "$app,$app/**" \
            --arg gid "$GOOGLE_OAUTH_CLIENT_ID" --arg gsec "$GOOGLE_OAUTH_CLIENT_SECRET" '
            {site_url: $site, uri_allow_list: $allow, external_email_enabled: true}
            + (if $gid != "" and $gsec != "" then {external_google_enabled: true, external_google_client_id: $gid, external_google_secret: $gsec} else {} end)')
          echo "::add-mask::$GOOGLE_OAUTH_CLIENT_SECRET"
          code=$(curl -sS -o /tmp/auth.out -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body")
          if [ "$code" -ge 300 ]; then echo "::error::Sign-in settings failed ($code)"; cat /tmp/auth.out; exit 1; fi
          if [ -z "$GOOGLE_OAUTH_CLIENT_ID" ]; then echo "::warning::Google sign-in not configured (GOOGLE_OAUTH_CLIENT_ID/SECRET missing). Email sign-in works."; fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Smoke test
        run: node scripts/smoke.mjs "$SUPABASE_URL" "$PUBLISHABLE_KEY"
