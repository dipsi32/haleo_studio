# Dev (canary): every merge to main lands on dev.haleo.studio, with its backend
# (migrations and functions) updated first when they changed. Every pull
# request gets its own preview link on the dev backend (pr-<n>.haleo-dev.pages.dev).
# Demo and production move only through Promote. See docs/environments.md.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      backend: ${{ steps.plan.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        run: |
          ref=$(grep -E '^PROJECT_REF=' deploy/dev.env | cut -d= -f2-)
          ready=false; [ -n "$ref" ] && ready=true
          [ "$ready" = true ] || echo "::notice::Dev isn't set up yet (deploy/dev.env is empty), so nothing was published. Production is unaffected: it moves only through Promote. See docs/environments.md."
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          # The backend redeploys on merges that touch it, or when run by hand.
          backend=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then backend=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            before="${{ github.event.before }}"
            # First push, or history we can't compare: redeploy the backend to be safe.
            if ! git cat-file -e "$before^{commit}" 2>/dev/null; then backend=true
            elif git diff --name-only "$before" HEAD | grep -qE '^supabase/(migrations|functions)/|^supabase/config.toml'; then backend=true; fi
          fi
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  # A pull request that isn't ready to deploy still gets its tests and build checked.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npm run build

  backend:
    needs: plan
    if: needs.plan.outputs.ready == 'true' && needs.plan.outputs.backend == 'true'
    uses: ./.github/workflows/bootstrap-backend.yml
    with:
      environment: dev
    secrets: inherit

  site:
    needs: [plan, backend]
    if: always() && needs.plan.outputs.ready == 'true' && github.event_name != 'pull_request' && (needs.backend.result == 'success' || needs.backend.result == 'skipped')
    uses: ./.github/workflows/site.yml
    with:
      environment: dev
    secrets: inherit

  # Previews only for branches in this repo (forks don't get the secrets).
  preview:
    needs: plan
    if: needs.plan.outputs.ready == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/site.yml
    with:
      environment: dev
      ref: ${{ github.event.pull_request.head.sha }}
      branch: pr-${{ github.event.pull_request.number }}
    secrets: inherit
